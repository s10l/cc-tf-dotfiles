# Global settings for the Makefile (make configure seeds this file;
# edit values by hand afterwards, existing lines are never overwritten).

USE_BUNDLE ?= 1
SCREENSHOT_DELAY ?= 5 # in seconds
ACCEPT_REMOTE_DRIFT ?= 1
# live HA config dir (make homeassistant): user@host:/path or absolute local path
HA_TARGET ?= @@HA_TARGET@@

# Infisical coordinates for secret_refs.yaml (make prepare-secrets; HUMAN-ONLY).
# PROJECT is the project UUID or slug, ENV the environment, SECRET_PATH the
# parent folder the device secrets live under.
INFISICAL_PROJECT ?=
INFISICAL_ENV ?= dev
INFISICAL_SECRET_PATH ?= devices
