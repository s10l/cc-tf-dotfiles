# One entry per !secret found under esphome/: name -> reference URI
# pointing to where the secret is stored (e.g. infisical://<project>/<env>/<path>).
# NOT the secret itself. `make configure` appends missing names with an empty
# value; fill them in by hand, or let `make prepare-secrets` (HUMAN-ONLY)
# generate them from a hand-filled secrets.yaml. One flat 'name: reference'
# per line, no spaces in the reference.
#
# Example (replace <project-id>, <env> and <device-name>):
# wifi_ssid: infisical://<project-id>/<env>/devices/<device-name>/wifi_ssid
#
# Leave values empty until the matching entry exists in the secret manager.
wifi_ssid:
wifi_password:
domain:
api_encryption_key:
wifi_ap_password:
