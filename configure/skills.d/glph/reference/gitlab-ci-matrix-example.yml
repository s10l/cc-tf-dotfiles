# Example GitLab CI pipeline: matrix stages for multiarch build + docker manifest.
# Global variables (DOCKER_REGISTRY_PROJECT, DOCKER_REPOSITORY, etc.) are
# illustrative and may change per project.
variables:
  DOCKER_REGISTRY_PROJECT: s10l
  DOCKER_REPOSITORY: cc-gi-alpine-developer-go
  DOCKER_REGISTRY_HOST_LOCAL: docker.io

stages:
  - build
  - manifest

build:
  stage: build
  image:
    name: s10l/gl-gi-docker-deploy:2026.09.07
  tags:
    - $BUILD_ARCH
  matrix:
    - BUILD_ARCH: AMD64
      TAG_SUFFIX: amd64
    - BUILD_ARCH: ARM64
      TAG_SUFFIX: arm64
  before_script:
    # docker
    - docker login -u $DOCKER_REGISTRY_USER -p $DOCKER_REGISTRY_PASS $DOCKER_REGISTRY_HOST_LOCAL
    - export IMAGE_DATE=$(date +%Y.%m.%d)
  script:
    - docker build -t $DOCKER_REGISTRY_HOST_LOCAL/$DOCKER_REGISTRY_PROJECT/$DOCKER_REPOSITORY:$IMAGE_DATE-$TAG_SUFFIX .
    - docker push $DOCKER_REGISTRY_HOST_LOCAL/$DOCKER_REGISTRY_PROJECT/$DOCKER_REPOSITORY:$IMAGE_DATE-$TAG_SUFFIX
    - docker tag $DOCKER_REGISTRY_HOST_LOCAL/$DOCKER_REGISTRY_PROJECT/$DOCKER_REPOSITORY:$IMAGE_DATE-$TAG_SUFFIX $DOCKER_REGISTRY_HOST_LOCAL/$DOCKER_REGISTRY_PROJECT/$DOCKER_REPOSITORY:latest-$TAG_SUFFIX
    - docker push $DOCKER_REGISTRY_HOST_LOCAL/$DOCKER_REGISTRY_PROJECT/$DOCKER_REPOSITORY:latest-$TAG_SUFFIX
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

manifest:
  stage: manifest
  image:
    name: s10l/gl-gi-docker-deploy:2026.09.07
  before_script:
    # docker
    - docker login -u $DOCKER_REGISTRY_USER -p $DOCKER_REGISTRY_PASS $DOCKER_REGISTRY_HOST_LOCAL
    - export IMAGE_DATE=$(date +%Y.%m.%d)
  script:
    - docker manifest create $DOCKER_REGISTRY_HOST_LOCAL/$DOCKER_REGISTRY_PROJECT/$DOCKER_REPOSITORY:$IMAGE_DATE --amend $DOCKER_REGISTRY_HOST_LOCAL/$DOCKER_REGISTRY_PROJECT/$DOCKER_REPOSITORY:$IMAGE_DATE-amd64 --amend $DOCKER_REGISTRY_HOST_LOCAL/$DOCKER_REGISTRY_PROJECT/$DOCKER_REPOSITORY:$IMAGE_DATE-arm64
    - docker manifest push $DOCKER_REGISTRY_HOST_LOCAL/$DOCKER_REGISTRY_PROJECT/$DOCKER_REPOSITORY:$IMAGE_DATE
    - docker manifest create $DOCKER_REGISTRY_HOST_LOCAL/$DOCKER_REGISTRY_PROJECT/$DOCKER_REPOSITORY:latest --amend $DOCKER_REGISTRY_HOST_LOCAL/$DOCKER_REGISTRY_PROJECT/$DOCKER_REPOSITORY:latest-amd64 --amend $DOCKER_REGISTRY_HOST_LOCAL/$DOCKER_REGISTRY_PROJECT/$DOCKER_REPOSITORY:latest-arm64
    - docker manifest push $DOCKER_REGISTRY_HOST_LOCAL/$DOCKER_REGISTRY_PROJECT/$DOCKER_REPOSITORY:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

## renovate ##

build-renovate:
  stage: build
  image:
    name: s10l/gl-gi-docker-deploy:2026.09.07
  tags:
    - $BUILD_ARCH
  matrix:
    - BUILD_ARCH: AMD64
      TAG_SUFFIX: amd64
    - BUILD_ARCH: ARM64
      TAG_SUFFIX: arm64
  before_script:
    # docker
    - docker login -u $DOCKER_REGISTRY_USER -p $DOCKER_REGISTRY_PASS $DOCKER_REGISTRY_HOST_LOCAL
  script:
    - docker build -t $DOCKER_REGISTRY_HOST_LOCAL/$DOCKER_REGISTRY_PROJECT/$DOCKER_REPOSITORY:$CI_COMMIT_SHORT_SHA-$TAG_SUFFIX .
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^renovate\//